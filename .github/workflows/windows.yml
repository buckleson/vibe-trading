name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Backend tests
        run: uv run pytest test/test_paper_broker.py test/test_buckleson_bridge.py -o addopts="" -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run src/stores src/components/layout src/components/auth src/pages/Trading.test.tsx src/pages/Positions.test.tsx

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package Windows bundle
        shell: pwsh
        run: ./scripts/windows/package.ps1

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Buckleson-windows
          path: out/Buckleson-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Buckleson-windows.zip
          generate_release_notes: true
